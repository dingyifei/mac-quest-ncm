name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and notarize only (no GitHub release, no tap update)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: v
        run: |
          V=$(sed -nE 's/.*string = "([^"]+)".*/\1/p' Sources/MQNCMCore/Version.swift)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$V" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Version.swift ($V)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning $KC | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          [[ -n "$IDENTITY" ]] || { echo "no Developer ID Application identity in the p12"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm $RUNNER_TEMP/cert.p12

      - name: Build and sign
        run: scripts/bundle-app.sh --sign "$IDENTITY"

      - name: Notarize
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > $RUNNER_TEMP/notary.p8
          scripts/notarize.sh "${{ steps.v.outputs.version }}" \
            --key $RUNNER_TEMP/notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm $RUNNER_TEMP/notary.p8

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.v.outputs.version }}
          path: release/

      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "v$V" release/* --title "Mac-Quest-NCM $V" --notes-file <(sed -n "/^## $V/,/^## /p" CHANGELOG.md | sed '$d')

      - name: Update Homebrew tap
        if: env.DRY_RUN != 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          V=${{ steps.v.outputs.version }}
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dingyifei/homebrew-tap.git" tap
          scripts/render-tap.sh "$V" release tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "mac-quest-ncm $V" && git push
