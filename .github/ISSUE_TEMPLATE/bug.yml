name: Bug / device report
description: Something doesn't work, or a report from a new headset / macOS version
body:
  - type: textarea
    id: status
    attributes:
      label: mqncm status --json
      description: Paste the output (you may redact the serial).
      render: json
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version and Mac model }
    validations: { required: true }
  - type: input
    id: headset
    attributes:
      label: Headset and Horizon OS version
      description: adb shell getprop ro.hzos.build.display_name
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
